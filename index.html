<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --shell: #e8e7e2;
            --shell-dark: #b8b7af;
            --shell-light: #f8f7f3;
            --screen-bezel: #8b8f94;
            --screen-glow: #8d9840;
            --screen-dim: #72823c;
            --ink: #24301f;
            --button: #1a1a1a;
            --button-dark: #050505;
            --accent: #1e3f9a;
            --gb-scale: 1;
        }

        html {
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.92), transparent 42%),
                linear-gradient(160deg, #dcdcd7 0%, #b9bbb0 100%);
            padding: 10px;
            color: var(--ink);
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
        }

        .stage {
            position: relative;
            display: inline-block;
        }

        .container {
            position: relative;
            width: 342px;
            background:
                linear-gradient(145deg, #f9f8f5, #e6e5e0 40%, #d4d3cd 100%);
            border-radius: 22px 22px 48px 22px;
            box-shadow:
                0 24px 42px rgba(0, 0, 0, 0.24),
                inset 0 4px 0 rgba(255, 255, 255, 0.88),
                inset 0 -12px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(117, 123, 130, 0.28);
            padding: 12px 14px 16px;
            overflow: hidden;
            transform-origin: top left;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 10px 12px auto 12px;
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.08));
        }

        .brand {
            display: inline-block;
            font-size: 0.62rem;
            color: #293792;
            font-weight: 700;
        }

        h1 {
            color: #293792;
            font-size: 0.92rem;
            margin-left: 0;
            letter-spacing: 0.02em;
            font-weight: 700;
        }

        .game-board-wrapper {
            position: relative;
            width: 89%;
            aspect-ratio: 1;
            margin: 50px auto 0;
            margin-bottom: 0;
        }

        .gameboy-logo {
            margin: 4px 0 0 3px;
            color: #293792;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 0.9;
            font-size: 0.78rem;
        }

        .gameboy-logo span {
            font-size: 0.62rem;
            margin-right: 2px;
        }

        .gameboy-logo strong {
            font-size: 1.24rem;
            letter-spacing: -0.02em;
        }

        .gameboy-logo sup {
            font-size: 0.45rem;
            vertical-align: text-top;
            margin-left: 2px;
        }

        .game-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 16%),
                linear-gradient(180deg, #d2e58d 0%, #c1d978 22%, #a9c35f 100%);
            border: 14px solid #8c8f93;
            border-radius: 18px 18px 24px 24px;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 0;
            touch-action: none;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 4px rgba(255, 255, 255, 0.06),
                inset 0 0 20px rgba(0, 0, 0, 0.08);
        }

        .screen-scorebar {
            position: absolute;
            left: 10px;
            right: 10px;
            top: 5px;
            height: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3px;
            color: rgba(44, 63, 20, 0.96);
            font-family: 'Courier New', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            pointer-events: none;
            z-index: 3;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.24);
        }

        .screen-scorebar::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 1px;
            background: rgba(88, 110, 40, 0.3);
        }

        .battery-dot {
            position: absolute;
            left: 17px;
            top: 75px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #db2a22;
            box-shadow: 0 0 0 1px rgba(60, 0, 0, 0.25);
        }

        .battery-label {
            position: absolute;
            left: 13px;
            top: 88px;
            font-size: 0.3rem;
            color: #8d8f98;
            letter-spacing: 0.14em;
            transform: rotate(-1deg);
        }

        .screen-brand {
            display: none;
        }

        .hud-data {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .speaker {
            position: absolute;
            right: 15px;
            bottom: 10px;
            width: 74px;
            height: 48px;
            transform: rotate(10deg);
            background:
                repeating-linear-gradient(110deg, transparent 0 7px, rgba(71, 71, 71, 0.95) 7px 10px, transparent 10px 16px);
            opacity: 0.7;
            pointer-events: none;
        }

        .cell {
            background: rgba(117, 138, 55, 0.12);
            border: 0.5px solid rgba(83, 103, 31, 0.12);
        }

        .snake {
            background: #51641f;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 1px;
        }

        .snake.head {
            background: #314016;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            z-index: 2;
        }

        .food {
            background: #6e7f27;
            box-shadow: 0 0 0 1px rgba(79, 93, 29, 0.35);
            border-radius: 1px;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 1px rgba(79, 93, 29, 0.22);
            }
            100% {
                box-shadow: 0 0 0 1px rgba(79, 93, 29, 0.4);
            }
        }

        .controls {
            position: relative;
            height: 212px;
            margin-top: 10px;
            margin-bottom: 0;
            z-index: 1;
        }

        .dpad-cluster {
            position: absolute;
            left: 12px;
            top: 14px;
            width: 144px;
            height: 144px;
            transform: scale(1.2);
            transform-origin: top left;
        }

        .control-btn {
            position: absolute;
            aspect-ratio: 1;
            background: linear-gradient(180deg, #1c1c1c, #080808);
            color: #ededed;
            border: none;
            border-radius: 8px;
            font-size: 1.35em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.08),
                0 4px 0 #000000;
        }

        .dpad-up {
            left: 38px;
            top: -10px;
            width: 34px;
            height: 50px;
            border-radius: 7px 7px 5px 5px;
        }

        .dpad-left {
            left: -5px;
            top: 33px;
            width: 50px;
            height: 34px;
            border-radius: 7px 5px 5px 7px;
        }

        .dpad-down {
            left: 38px;
            top: 60px;
            width: 34px;
            height: 50px;
            border-radius: 5px 5px 7px 7px;
        }

        .dpad-right {
            left: 65px;
            top: 33px;
            width: 50px;
            height: 34px;
            border-radius: 5px 7px 7px 5px;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.05),
                0 1px 0 #000000;
        }

        .action-cluster {
            position: absolute;
            right: -2px;
            top: 56px;
            width: 146px;
            height: 116px;
            z-index: 1;
        }

        .action-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
            color: #fff;
            background: linear-gradient(180deg, #c91b7a, #a31162 55%, #72083f);
            touch-action: manipulation;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.22),
                0 4px 0 #5a0731;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.12),
                0 1px 0 #5a0731;
        }

        .face-label {
            position: absolute;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #32448e;
            pointer-events: none;
        }

        .pause-btn {
            left: 42px;
            top: -10px;
        }

        .reset-btn {
            left: 104px;
            top: -34px;
        }

        .pause-label {
            left: 44px;
            top: 38px;
        }

        .reset-label {
            left: 104px;
            top: 18px;
        }

        .start-select-cluster {
            position: absolute;
            left: calc(50% + 5px);
            top: 135px;
            width: 164px;
            height: 50px;
            transform: translateX(-38%);
            z-index: 2;
        }

        .pill-btn {
            position: absolute;
            width: 62px;
            height: 18px;
            padding: 0;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, #c7c7c7, #8f8f8f);
            touch-action: manipulation;
            z-index: 3;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 2px 0 rgba(104, 104, 104, 0.7);
        }

        .pill-btn:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                0 1px 0 rgba(104, 104, 104, 0.7);
        }

        .select-btn {
            left: 20px;
            top: -3px;
            transform: rotate(-14deg);
        }

        .start-mini-btn {
            left: 104px;
            top: -5px;
            transform: rotate(-14deg);
        }

        .menu-label {
            position: absolute;
            top: 16px;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #32448e;
            transform: rotate(-14deg);
            pointer-events: none;
        }

        .select-label {
            left: 32px;
            top: 19px;
        }

        .start-label {
            left: 120px;
            top: 18px;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(80, 87, 60, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            z-index: 10;
        }

        .game-over-screen.active {
            display: flex;
        }

        .game-over-content {
            text-align: center;
            color: #edf4cb;
        }

        .game-over-content h2 {
            font-size: 2.3em;
            margin-bottom: 20px;
            color: #f5f8e6;
            letter-spacing: 0.12em;
        }

        .game-over-content p {
            font-size: 1.35em;
            margin-bottom: 10px;
        }

        .game-over-content .final-score {
            font-size: 2.2em;
            color: #f0f4c3;
            margin-bottom: 30px;
        }

        .info {
            background: linear-gradient(180deg, rgba(243, 243, 238, 0.98), rgba(224, 223, 216, 0.98));
            padding: 15px 16px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 1em;
            color: #565d67;
            line-height: 1.6;
            border: 1px solid rgba(112, 118, 124, 0.35);
            position: relative;
            z-index: 1;
        }

        .info h3 {
            color: #4c5561;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .info ul {
            margin-left: 20px;
        }

        .info li {
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                width: 342px;
            }

            .controls {
                height: 214px;
            }

            .game-board-wrapper {
                margin-top: 60px;
            }
        }

        @media (max-width: 400px) {
            .container {
                width: 342px;
            }

            .game-board-wrapper {
                margin-top: 56px;
            }

            .controls {
                height: 206px;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="container">
            <div class="game-board-wrapper">
                <div class="battery-dot"></div>
                <div class="battery-label">BATTERY</div>
                <div class="game-board" id="gameBoard">
                    <div class="screen-scorebar" id="screenScorebar"></div>
                    <div class="game-over-screen" id="gameOverScreen">
                        <div class="game-over-content">
                            <h2>GAME OVER!</h2>
                            <p>Your Score:</p>
                            <div class="final-score" id="finalScore">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="gameboy-logo"><span>Yucan</span><strong>GAME BOY</strong><sup>TM</sup></div>

            <div class="hud-data" aria-hidden="true">
                <div id="score">0</div>
                <div id="highScore">0</div>
                <div id="level">1</div>
            </div>

            <div class="controls">
                <div class="dpad-cluster" aria-label="direction controls">
                    <button class="control-btn dpad-up" id="upBtn">▲</button>
                    <button class="control-btn dpad-left" id="leftBtn">◄</button>
                    <button class="control-btn dpad-down" id="downBtn">▼</button>
                    <button class="control-btn dpad-right" id="rightBtn">►</button>
                </div>

                <div class="start-select-cluster" aria-label="menu controls">
                    <button class="pill-btn select-btn" id="selectBtn" aria-label="Select"></button>
                    <button class="pill-btn start-mini-btn" id="startBtn" aria-label="Start"></button>
                    <span class="menu-label select-label">SELECT</span>
                    <span class="menu-label start-label">START</span>
                </div>

                <div class="action-cluster" aria-label="game actions">
                    <button class="action-btn pause-btn" id="pauseBtn" aria-label="Pause"></button>
                    <button class="action-btn reset-btn" id="resetBtn" aria-label="Reset"></button>
                    <span class="face-label pause-label">PAUSE</span>
                    <span class="face-label reset-label">RESET</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 100;
        const SPEED_INCREMENT = 5;
        const FOOD_SCORE = 10;

        // Game variables
        let gameBoard = document.getElementById('gameBoard');
        let snake = [{x: 10, y: 10}];
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let food = {x: 15, y: 15};
        let score = 0;
        let highScore = Number(localStorage.getItem('snakeHighScore')) || 0;
        let gameActive = false;
        let gamePaused = false;
        let gameSpeed = INITIAL_SPEED;
        let gameLoop = null;

        // Initialize game
        function init() {
            document.getElementById('highScore').textContent = highScore;
            createGameGrid();
            updateDisplay();
            setupEventListeners();
            loadHighScore();
        }

        // Create game grid
        function createGameGrid() {
            gameBoard.innerHTML = '';
            const scorebar = document.createElement('div');
            scorebar.className = 'screen-scorebar';
            scorebar.id = 'screenScorebar';
            gameBoard.appendChild(scorebar);
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                gameBoard.appendChild(cell);
            }
            const gameOverScreen = document.createElement('div');
            gameOverScreen.id = 'gameOverScreen';
            gameOverScreen.className = 'game-over-screen';
            gameOverScreen.innerHTML = `
                <div class="game-over-content">
                    <h2>GAME OVER!</h2>
                    <p>Your Score:</p>
                    <div class="final-score" id="finalScore">0</div>
                </div>
            `;
            gameBoard.appendChild(gameOverScreen);
        }

        // Get cell index
        function getCellIndex(x, y) {
            return y * GRID_SIZE + x;
        }

        // Update display
        function updateDisplay() {
            // Clear all cells
            document.querySelectorAll('.cell').forEach(cell => {
                cell.className = 'cell';
            });

            // Draw snake
            snake.forEach((segment, index) => {
                const cellIndex = getCellIndex(segment.x, segment.y);
                const cell = document.getElementById(`cell-${cellIndex}`);
                if (cell) {
                    cell.classList.add('snake');
                    if (index === 0) {
                        cell.classList.add('head');
                    }
                }
            });

            // Draw food
            const foodCellIndex = getCellIndex(food.x, food.y);
            const foodCell = document.getElementById(`cell-${foodCellIndex}`);
            if (foodCell) {
                foodCell.classList.add('food');
            }

            // Update score
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = Math.floor(score / 50) + 1;
            const scorebar = document.getElementById('screenScorebar');
            if (scorebar) {
                const leftValue = String(score).padStart(4, '0');
                const rightValue = String(highScore).padStart(4, '0');
                scorebar.innerHTML = `<span class="screen-score-left">${leftValue}</span><span class="screen-score-right">${rightValue}</span>`;
            }
        }

        // Update direction
        function updateDirection(x, y) {
            // Prevent 180-degree turns
            if ((direction.x === -x && direction.y === -y) || gamePaused) {
                return;
            }
            nextDirection = {x, y};
        }

        // Generate food
        function generateFood() {
            let newFood;
            let isValid = false;
            
            while (!isValid) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                
                // Check if food overlaps with snake
                isValid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }
            
            food = newFood;
        }

        // Game update
        function update() {
            if (!gameActive || gamePaused) return;

            // Update direction
            direction = nextDirection;

            // Calculate new head position
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            // Check wall collision
            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                endGame();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            // Add new head
            snake.unshift(newHead);

            // Check food collision
            if (newHead.x === food.x && newHead.y === food.y) {
                score += FOOD_SCORE;
                generateFood();
                // Increase speed
                gameSpeed = Math.max(50, INITIAL_SPEED - Math.floor(score / 100) * SPEED_INCREMENT);
                clearInterval(gameLoop);
                gameLoop = setInterval(update, gameSpeed);
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            updateDisplay();
        }

        // Start game
        function startGame() {
            if (gameActive) return;

            if (document.getElementById('gameOverScreen').classList.contains('active')) {
                resetGame();
            }
            
            gameActive = true;
            gamePaused = false;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('gameOverScreen').classList.remove('active');
            
            gameLoop = setInterval(update, gameSpeed);
        }

        // Pause game
        function togglePause() {
            if (!gameActive) return;
            
            gamePaused = !gamePaused;
        }

        // End game
        function endGame() {
            gameActive = false;
            gamePaused = false;
            clearInterval(gameLoop);
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.add('active');
        }

        // Reset game
        function resetGame() {
            gameActive = false;
            gamePaused = false;
            clearInterval(gameLoop);
            
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameSpeed = INITIAL_SPEED;
            
            generateFood();
            updateDisplay();
            
            document.getElementById('gameOverScreen').classList.remove('active');
        }

        // Setup event listeners
        function setupEventListeners() {
            const bindTouchButton = (element, handler) => {
                const handlePress = (event) => {
                    event.preventDefault();
                    handler();
                };

                element.addEventListener('click', handler);
                element.addEventListener('touchend', handlePress, { passive: false });
            };

            // Button controls
            bindTouchButton(document.getElementById('startBtn'), startGame);
            bindTouchButton(document.getElementById('pauseBtn'), togglePause);
            bindTouchButton(document.getElementById('resetBtn'), resetGame);

            // Direction buttons
            bindTouchButton(document.getElementById('upBtn'), () => updateDirection(0, -1));
            bindTouchButton(document.getElementById('downBtn'), () => updateDirection(0, 1));
            bindTouchButton(document.getElementById('leftBtn'), () => updateDirection(-1, 0));
            bindTouchButton(document.getElementById('rightBtn'), () => updateDirection(1, 0));

            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        updateDirection(0, -1);
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        updateDirection(0, 1);
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        updateDirection(-1, 0);
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        updateDirection(1, 0);
                        e.preventDefault();
                        break;
                }
            });

            document.addEventListener('dblclick', (e) => {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturestart', (e) => {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturechange', (e) => {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gestureend', (e) => {
                e.preventDefault();
            }, { passive: false });

            // Touch/Swipe controls
            let touchStartX = 0;
            let touchStartY = 0;

            gameBoard.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, false);

            gameBoard.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, false);

            gameBoard.addEventListener('touchend', (e) => {
                if (!gameActive) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                const minSwipeDistance = 30;
                
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (Math.abs(deltaX) > minSwipeDistance) {
                        if (deltaX > 0) {
                            updateDirection(1, 0);
                        } else {
                            updateDirection(-1, 0);
                        }
                    }
                } else {
                    if (Math.abs(deltaY) > minSwipeDistance) {
                        if (deltaY > 0) {
                            updateDirection(0, 1);
                        } else {
                            updateDirection(0, -1);
                        }
                    }
                }
            }, false);
        }

        // Load high score from localStorage
        function loadHighScore() {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
                document.getElementById('highScore').textContent = highScore;
            }
        }

        // Start the game
        function updateGameboyScale() {
            const stage = document.querySelector('.stage');
            const container = document.querySelector('.container');

            if (!stage || !container) return;

            container.style.transform = 'none';
            const baseWidth = 342;
            const baseHeight = container.scrollHeight;
            const availableWidth = window.innerWidth - 20;
            const availableHeight = window.innerHeight - 20;
            const scale = Math.min(availableWidth / baseWidth, availableHeight / baseHeight);

            stage.style.width = `${baseWidth * scale}px`;
            stage.style.height = `${baseHeight * scale}px`;
            container.style.transform = `scale(${scale})`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            init();
            updateGameboyScale();
        });
        window.addEventListener('resize', updateGameboyScale);
    </script>
</body>
</html>
